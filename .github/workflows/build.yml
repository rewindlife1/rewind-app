name: Build, test & deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Pinned for reproducible builds. Bump deliberately.
          flutter-version: 3.29.3
          channel: stable
          cache: true

      # Generates the native android/ and ios/ folders on the fly.
      # Existing files (lib/, web/, pubspec, tests) are never overwritten.
      - name: Generate platform folders
        run: flutter create --platforms=web,android,ios --project-name rewind --org co.rewindlife .

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Build web
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          BASE_HREF: ${{ vars.BASE_HREF || '/' }}
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN || 'app.rewindlife.co' }}
        run: |
          flutter build web --release \
            --base-href "$BASE_HREF" \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"
          cp build/web/index.html build/web/404.html
          if [ -n "$CUSTOM_DOMAIN" ]; then echo "$CUSTOM_DOMAIN" > build/web/CNAME; fi

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: build/web

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
